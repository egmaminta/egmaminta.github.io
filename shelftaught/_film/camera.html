<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Checkout film camera</title>
  <style>
    @font-face {
      font-family: 'OpenAI Sans';
      src: url('https://cdn.openai.com/common/fonts/openai-sans/v2/OpenAISans-Regular.woff2');
    }
    @font-face {
      font-family: 'OpenAI Sans';
      font-weight: 600;
      src: url('https://cdn.openai.com/common/fonts/openai-sans/v2/OpenAISans-Semibold.woff2');
    }
    html,
    body {
      margin: 0;
      background: white;
    }
    canvas {
      display: block;
    }
  </style>
  <canvas width="1280" height="720"></canvas>
  <script type="module">
    import * as T from '../three-r180/three.module.min.js';
    import { buildRoom, lightRoom } from '../store.js?v=3';
    import { stageShoppers, captureAt, makeShopper } from '../shoppers.js?v=2';
    import { exitSequence } from './exit.js';
    import { focusLens } from './focus.js';
    await Promise.all(['400', '600'].map((w) => document.fonts.load(w + ' 16px "OpenAI Sans"')));
    const canvas = document.querySelector('canvas');
    const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 720, false);
    renderer.setClearColor(0xd9e8e4);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    const scene = new T.Scene();
    lightRoom(scene);
    const { heroes } = buildRoom(scene);
    const actors = stageShoppers(scene, heroes);
    const camera = new T.PerspectiveCamera(44, 16 / 9, 0.018, 45);
    const cues = await (await fetch('./exit-cues.json')).json();
    let exterior, leave, focus;
    const s = (n) => T.MathUtils.smoothstep(n, 0, 1);
    window.frameAt = (shot, u) => {
      if (exterior) exterior.visible = shot === 'exit';
      actors.people.beans.root.visible = heroes.beans.visible = shot !== 'exit';
      if (shot === 'exit') {
        if (!leave) {
          actors.reset('ranch', heroes.ranch);
          exterior = new T.Group();
          scene.add(exterior);
          const carton = heroes.beans.clone();
          carton.visible = true;
          exterior.add(carton);
          leave = exitSequence(exterior, makeShopper(exterior), carton, cues);
          focus = focusLens(renderer);
        }
        const { distance, radius } = leave(camera, u);
        focus(scene, camera, distance, radius);
        return;
      } else if (shot === 'poster') {
        actors.reset('beans', heroes.beans);
        actors.reset('ranch', heroes.ranch);
        camera.position.set(0.15, 1.65, 4.05);
        camera.lookAt(0, 1.46, -2.55);
        camera.fov = 47;
      } else {
        const close = s((u - 0.04) / 0.42);
        actors.pickup('ranch', heroes.ranch, captureAt * Math.min(1, 0.14 + u * 1.53));
        actors.pickup('beans', heroes.beans, captureAt * T.MathUtils.clamp((u - 0.115) / 0.61, 0, 1));
        if (u < 0.72) {
          // A three-quarter view keeps the reaching arm, shelf edge and planted feet in view.
          camera.position.set(1.1 - 1.00 * close, 1.52, 1.97 - 3.34 * close);
          camera.lookAt(-0.18 - 1.02 * close, 1.14 + 0.24 * close, -2.34);
          camera.fov = 45 - 8 * close;
        } else {
          actors.cameraView(camera, heroes.beans, s((u - 0.72) / 0.15));
        }
      }
      camera.updateProjectionMatrix();
      renderer.render(scene, camera);
    };
    window.frameAt('poster', 0);
  </script>
</html>
