  <figcaption><strong>The elbow can keep its bend while the gripper moves.</strong> The blue dot marks where the gripper attaches to the forearm. This illustration calculates geometry for links of length 1 and 0.8 in arbitrary units. Gripper direction is measured from the horizontal axis and equals the sum of the joint angles. The jaw opening stays fixed as the arm moves. The sliders set the configuration without simulating forces.</figcaption>
  <noscript><p class="interaction-hint">JavaScript enables the joint-angle controls.</p></noscript>
