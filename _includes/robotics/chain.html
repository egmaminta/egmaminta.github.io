  <figcaption><strong>The elbow can keep its bend while the tool moves.</strong> This illustration calculates geometry for links of length 1 and 0.8 in arbitrary units. Tool direction is measured from the horizontal axis and equals the sum of the joint angles. The displayed values are calculations for this drawing. They are separate from the pending MuJoCo measurements. The sliders set the configuration without simulating forces.</figcaption>
