<a class="robot-model-card" href="{{ include.model.source }}">
  <img src="{{ include.model.image | prepend: '/assets/img/robotics/menagerie/' | relative_url }}" width="500" height="500" loading="lazy" decoding="async" alt="">
  <span class="model-category">{{ include.model.category }}</span>
  <span class="model-name">{{ include.model.name }}</span>
</a>
